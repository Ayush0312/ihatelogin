<head>

  <meta property="og:type" content="website">

  <meta property="og:title" content="ihatelogin.in">

  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Crect x='6' y='15' width='20' height='2.5' fill='%23e5401f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400&display=block" rel="stylesheet">
  <script>document.documentElement.classList.add('js')</script>
  <style>
    :root {
      --paper: #f2f2ef;
      --ink: #1a1a19;
      --quiet: #70706b;
      --strike: #e5401f;
      --gutter: clamp(1.25rem, 3.2vw, 2.75rem);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141413;
        --ink: #ecece8;
        --quiet: #8a8a84;
        --strike: #ff5a36;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--gutter);
      background: var(--paper);
      color: var(--ink);
      font-family: "Funnel Display", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
      font-size: clamp(.9rem, 1vw + .5rem, 1rem);
      line-height: 1.5;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: var(--strike); color: var(--paper); }

    .note { margin: 0; color: var(--quiet); }
    footer { display: flex; justify-content: space-between; gap: 1rem; }

    .wordmark {
      align-self: end;
      margin: 0 0 clamp(1.5rem, 4vw, 3.5rem) -0.04em;
      font-weight: 300;
      font-size: clamp(3rem, 21.5vw, 25rem);
      line-height: .9;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .struck {
      position: relative;
      display: inline-block;
    }
    .struck::after {
      content: "";
      position: absolute;
      left: -.02em;
      right: .04em;
      top: 55%;
      height: .022em;
      min-height: 2px;
      background: var(--strike);
      transform-origin: left center;
      transition: transform .9s cubic-bezier(.65, 0, .2, 1);
    }

    /* Draw the line once on load; without JS it is simply drawn. */
    .js .struck::after { transform: scaleX(0); }
    .js.ready .struck::after { transform: scaleX(1); }

    /* Lift the line while the pointer is on the word. */
    @media (hover: hover) {
      .js.ready .wordmark:hover .struck::after {
        transform: scaleX(0);
        transform-origin: right center;
        transition-duration: .5s;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .struck::after { transition: none; }
    }
  </style>
</head>
<body>
  <p class="note">Site in progress</p>

  <h1 class="wordmark" aria-label="ihatelogin">ihate<span class="struck">login</span></h1>

  <footer>
    <p class="note">A new website is on its way.</p>
    <p class="note">© 2026</p>
  </footer>

  <script>
    // Wait for the font so the line is drawn on the final word, not a fallback.
    var root = document.documentElement;
    var go = function () { setTimeout(function () { root.classList.add('ready'); }, 300); };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
    setTimeout(go, 2500);
  </script>
</body>
</html>
